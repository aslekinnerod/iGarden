<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & labels" subtitle="Flat iOS grouped surfaces, hairline separators" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);display:flex;gap:8px;padding:16px;background:#fff}.s{flex:1;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:118px;box-sizing:border-box;border:1px solid var(--separator)}.s b{font-size:12px}.s span{font-size:11px;opacity:.7}</style></head><body>
<div class="s" style="background:var(--bg-grouped)"><b>bg-grouped</b><span>#F2F2F7</span></div>
<div class="s" style="background:var(--surface-card)"><b>surface-card</b><span>#FFFFFF</span></div>
<div class="s" style="background:#fff"><div style="border-top:1px solid var(--separator);margin-bottom:auto;margin-top:40px"></div><b>separator</b><span>rgba(60,60,67,.29)</span></div>
<div class="s" style="background:#fff;color:var(--label-1)"><b>label-1</b><span>#000</span></div>
<div class="s" style="background:#fff;color:var(--label-2)"><b>label-2</b><span>rgba(60,60,67,.6)</span></div>
<div class="s" style="background:#fff;color:var(--label-3)"><b>label-3</b><span>rgba(60,60,67,.3)</span></div>
</body></html>
